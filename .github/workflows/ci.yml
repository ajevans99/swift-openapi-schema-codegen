name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift 6.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.1.3"
      - name: Unit tests with remote dependencies
        run: |
          swift --version
          swift test --jobs 4
          python3 -m unittest discover -s Tests/OpenAPIClient -p 'test_*.py'
      - name: Fetch checksum-pinned acceptance corpus
        run: bash Tests/OpenAPIClient/fetch-openai.sh
      - name: Generate and run cross-module authored and OpenAI consumers
        run: bash Tests/OpenAPIClient/smoke.sh
      - name: Generate and run bounded pristine Responses consumer
        run: bash Tests/OpenAPIClient/responses.sh
      - name: Diagnose macOS consumer launch failure
        if: failure() && runner.os == 'macOS'
        run: |
          mkdir -p .build/diagnostics
          exec > >(tee .build/diagnostics/macos-launch.log) 2>&1
          diagnostic() {
            printf '\nCommand:'
            printf ' %q' "$@"
            printf '\n'
            if "$@"; then
              echo "Exit status: 0"
            else
              echo "Exit status: $?"
            fi
          }
          export OPENAPI_CODEGEN_PATH="$GITHUB_WORKSPACE"
          consumer="$(swift build --package-path .build/openapi-consumer --show-bin-path)/Consumer"
          diagnostic sw_vers
          diagnostic sysctl hw.memsize hw.activecpu
          ulimit -a
          diagnostic vm_stat
          diagnostic memory_pressure -Q
          diagnostic file "$consumer"
          diagnostic codesign --verify --strict --verbose=4 "$consumer"
          diagnostic codesign -dvvv "$consumer"
          diagnostic otool -L "$consumer"
          diagnostic /usr/bin/time -l "$consumer"
          diagnostic sudo /usr/bin/log show --last 5m --style compact \
            --predicate 'eventMessage CONTAINS[c] "Consumer" AND (process == "kernel" OR process == "amfid" OR process == "taskgated-helper" OR process == "syspolicyd")'
          diagnostic find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 \
            -name 'Consumer*' -type f -print -exec cat '{}' \;
      - name: Retain bounded compatibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-${{ matrix.os }}
          path: |
            .build/openapi-corpus/*compatibility.tsv
            .build/openapi-corpus/responses-released-*.json
            .build/openapi-corpus/responses-released-*.log
            .build/diagnostics/*.log
          if-no-files-found: ignore
